<!--
  移动端 e2e 的真实视口来源：
  agent-browser 无法直接改视口宽度，但 <iframe> 内的媒体查询按 iframe 尺寸计算，
  同源（都是 8848）时父页面能读 iframe 内的 DOM 与 computedStyle。
  所以「窄屏布局」可以在无真机环境里被真实验证——本页就是那个 390×844 的视口。
-->
